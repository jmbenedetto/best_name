[project]
name = "best_name"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "click>=8.2.1",
    "docling>=2.51.0",
    "dspy>=2.4.0",
    "ipykernel>=7.1.0",
    "pandas>=2.3.2",
    "python-dotenv>=1.1.1",
    "pyyaml>=6.0.2",
    "toml>=0.10.2",
]

[project.scripts]
best_name = "best_name:cli"

[tool.uv]
package = true

[tool.setuptools]
packages = ["best_name"]

[tool.setuptools.package-data]
best_name = ["config.yaml", "conventions.md", "system_prompt.md"]

[dependency-groups]
dev = [
    "pytest>=9.0.1",
]